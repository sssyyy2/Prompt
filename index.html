<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="icon.png">
    <title>指令库</title>
    <style>
        :root { --t-size: 15px; --c-size: 10px; --cols: 3; }
        body { font-family: -apple-system, sans-serif; background: #f2f2f7; margin: 0; padding: 20px; padding-top: 100px; -webkit-user-select: none; }
        .header-fixed { position: fixed; top: 0; left: 0; right: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 0.5px solid #d1d1d6; padding-bottom: 12px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; height: 44px; }
        .nav-bar h1 { font-size: 19px; margin: 0; font-weight: 800; }
        .tabs-container { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 15px; overflow-x: auto; white-space: nowrap; }
        .tab { background: #fff; padding: 5px 12px; border-radius: 12px; font-size: 13px; color: #8e8e93; border: 0.5px solid #d1d1d6; }
        .tab.active { background: #007AFF; color: #fff; border-color: #007AFF; }
        .grid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 10px; padding: 10px; }
        @keyframes wobble { 0% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } 100% { transform: rotate(-1.2deg); } }
        .sorting-mode .card { animation: wobble 0.25s infinite; touch-action: none; }
        .sorting-mode .dragging { opacity: 0.5; transform: scale(1.1); animation: none; z-index: 10; }
        .card { background: white; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); aspect-ratio: 1 / 1; display: flex; flex-direction: column; overflow: hidden; position: relative; transition: transform 0.2s; }
        .card-title { font-weight: bold; font-size: var(--t-size); margin-bottom: 6px; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-content { font-size: var(--c-size); color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; line-height: 1.4; pointer-events: none; }
        .tag-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 10px; border: 1px dashed #ccc; }
        .tag-chip { background: #fff; color: #007AFF; padding: 6px 12px; border-radius: 15px; font-size: 12px; border: 0.5px solid #007AFF; font-weight: 500; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; }
        .modal-content { background: #fff; width: 85%; margin: 15% auto; border-radius: 20px; padding: 20px; max-height: 80vh; overflow-y: auto; }
        .setting-row { margin: 15px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid #eee; padding-bottom: 10px; }
        textarea, input[type="text"] { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-top: 5px; box-sizing: border-box; font-size: 16px; }
        button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; font-size: 15px; }
        .save-btn { background: #007AFF; color: #fff; }
        .danger-btn { background: #fff; color: #ff3b30; border: 0.5px solid #ff3b30; margin-top: 20px; font-size: 13px; }
        #toast { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; display: none; z-index: 3000; }
    </style>
</head>
<body>

<div id="toast"></div>
<div class="header-fixed">
    <div class="nav-bar">
        <div id="normalNav" style="display: flex; width: 100%; justify-content: space-between; align-items: center;">
            <span onclick="toggleModal('settingsModal')" style="color:#007AFF; font-size:18px;">⚙️</span>
            <h1>指令库</h1>
            <div>
                <span onclick="enterSortMode()" style="color:#007AFF; margin-right: 15px; font-size:18px;">⇅</span>
                <span onclick="openAddModal()" style="color:#007AFF; font-size:24px">+</span>
            </div>
        </div>
        <div id="sortNav" style="display: none; width: 100%; justify-content: center; align-items: center;">
            <button onclick="exitSortMode()" class="save-btn" style="max-width: 140px; height: 34px; padding: 0;">完成排序</button>
        </div>
    </div>
    <div class="tabs-container" id="tabsList"></div>
</div>
<div class="grid" id="promptGrid"></div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">编辑指令</h3>
        <input type="text" id="editTitle" placeholder="标题">
        <textarea id="editContent" rows="8" placeholder="内容"></textarea>
        <div style="margin-top:15px;">
            <label style="font-size: 13px; color: #8e8e93;">快速选择分类：</label>
            <div class="tag-pool" id="tagPool"></div> 
            <input type="text" id="editTag" placeholder="或输入新标签" style="margin-top:10px;">
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button style="background: #ff3b30; color: #fff;" id="deleteBtn" onclick="deleteItem()">删除</button>
            <button onclick="toggleModal('editModal')">取消</button>
            <button class="save-btn" onclick="saveItem()">保存修改</button>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3>App 设置</h3>
        <div class="setting-row">每行列数: <input type="number" id="cfgCols" style="width:50px"></div>
        <div class="setting-row">标题字号: <input type="number" id="cfgTSize" style="width:50px"></div>
        <div class="setting-row">内容字号: <input type="number" id="cfgCSize" style="width:50px"></div>
        <div class="setting-row">触感反馈: <input type="checkbox" id="cfgHaptic"></div>
        <div class="setting-row">默认标签 (逗号分隔):</div>
        <textarea id="cfgTags" rows="2"></textarea>
        <hr style="margin:20px 0; border:0.5px solid #eee;">
        <button onclick="exportData()" style="background:#f2f2f7; color:#007AFF;">一键备份 (复制代码)</button>
        <button onclick="importData()" style="background:#f2f2f7; color:#000; margin-top:10px;">导入备份代码</button>
        <button onclick="resetEverything()" class="danger-btn">⚠️ 彻底重置所有数据</button>
        <button onclick="applySettings()" class="save-btn" style="margin-top:20px;">保存并应用</button>
    </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('pb_data')) || [];
let config = JSON.parse(localStorage.getItem('pb_config')) || { cols: 3, tSize: 15, cSize: 10, haptic: true, tags: ["投资", "阅读"] };
let currentTag = '全部';
let isSorting = false;
let editId = null;

// 【重磅强化】暴力解码引擎 + 自动粘贴修复
async function importData() {
    let clipboardText = "";
    try {
        // 增加权限判断，避免直接报错导致脚本停止
        if (navigator.clipboard && navigator.clipboard.readText) {
            clipboardText = await navigator.clipboard.readText();
        }
    } catch (err) { console.log("剪贴板访问受限"); }

    let str = prompt('请粘贴备份代码：', clipboardText);
    if(!str || str.trim() === "") return;
    str = str.trim();

    // 暴力尝试所有可能的解码路径
    let decoded = "";
    let success = false;

    const decodeAttempts = [
        (s) => decodeURIComponent(escape(atob(s))), // 标准 UTF-8
        (s) => decodeURIComponent(atob(s)),         // 旧版直接编码
        (s) => decodeURI(atob(s)),                  // 极简编码
        (s) => atob(s)                              // 原始 Base64
    ];

    for (let attempt of decodeAttempts) {
        try {
            decoded = attempt(str);
            let parsed = JSON.parse(decoded);
            if (parsed.data) {
                data = parsed.data;
                if (parsed.config) config = parsed.config;
                success = true;
                break; 
            }
        } catch (e) { continue; }
    }

    if (success) {
        localStorage.setItem('pb_data', JSON.stringify(data));
        localStorage.setItem('pb_config', JSON.stringify(config));
        showToast('✅ 导入成功');
        setTimeout(() => location.reload(), 500);
    } else {
        alert('❌ 导入失败：备份代码格式无法识别，请确保复制完整。');
    }
}

function exportData() {
    const str = btoa(unescape(encodeURIComponent(JSON.stringify({data, config}))));
    navigator.clipboard.writeText(str).then(() => { showToast('✅ 备份代码已复制'); });
}

// 排序功能回归
function initSortable(el) {
    let dragEl = null;
    el.addEventListener('touchstart', e => { if (isSorting) { dragEl = e.target.closest('.card'); if(dragEl) dragEl.classList.add('dragging'); } }, {passive: false});
    el.addEventListener('touchmove', e => {
        if (!isSorting || !dragEl) return;
        e.preventDefault();
        let touch = e.touches[0];
        let target = document.elementFromPoint(touch.clientX, touch.clientY);
        let nextEl = target ? target.closest('.card') : null;
        if (nextEl && nextEl !== dragEl) {
            let rect = nextEl.getBoundingClientRect();
            let next = (touch.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
            el.insertBefore(dragEl, next && nextEl.nextSibling || nextEl);
        }
    }, {passive: false});
    el.addEventListener('touchend', () => { if (dragEl) { dragEl.classList.remove('dragging'); saveCurrentOrder(); dragEl = null; } });
}
function saveCurrentOrder() {
    const ids = Array.from(document.querySelectorAll('.card')).map(c => c.dataset.id);
    data = ids.map(id => data.find(d => d.id == id)).filter(i => i);
    localStorage.setItem('pb_data', JSON.stringify(data));
}
function enterSortMode() { isSorting = true; doHaptic(); document.getElementById('normalNav').style.display='none'; document.getElementById('sortNav').style.display='flex'; document.body.classList.add('sorting-mode'); }
function exitSortMode() { isSorting = false; doHaptic(); document.getElementById('normalNav').style.display='flex'; document.getElementById('sortNav').style.display='none'; document.body.classList.remove('sorting-mode'); renderGrid(); showToast('✅ 顺序已保存'); }

function renderTagPool() {
    const pool = document.getElementById('tagPool'); pool.innerHTML = '';
    let allTags = new Set([...config.tags, ...data.map(d => d.tag)]);
    allTags.forEach(tag => {
        if(!tag) return;
        const chip = document.createElement('div'); chip.className = 'tag-chip'; chip.innerText = tag;
        chip.onclick = () => { document.getElementById('editTag').value = tag; doHaptic(); };
        pool.appendChild(chip);
    });
}

function resetEverything() { if(confirm('⚠️ 确定要清空所有数据吗？')) { localStorage.clear(); location.reload(); } }
function showToast(text) { const t = document.getElementById('toast'); t.innerText = text; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 2000); }
function doHaptic() { if (config.haptic && window.navigator.vibrate) window.navigator.vibrate(25); }

function renderTabs() {
    const container = document.getElementById('tabsList');
    container.innerHTML = `<div class="tab ${currentTag==='全部'?'active':''}" onclick="filterTag('全部')">全部</div>`;
    config.tags.forEach(tag => { container.innerHTML += `<div class="tab ${currentTag===tag?'active':''}" onclick="filterTag('${tag}')">${tag}</div>`; });
}
function filterTag(tag) { if(isSorting) return; doHaptic(); currentTag = tag; renderTabs(); renderGrid(); }

function renderGrid() {
    const grid = document.getElementById('promptGrid'); grid.innerHTML = '';
    const filtered = data.filter(item => currentTag === '全部' || item.tag === currentTag);
    filtered.forEach(item => {
        const card = document.createElement('div'); card.className = 'card'; card.dataset.id = item.id;
        card.innerHTML = `<div class="card-title">${item.title}</div><div class="card-content">${item.content}</div>`;
        card.onclick = () => { if(isSorting) return; navigator.clipboard.writeText(item.content).then(() => { doHaptic(); showToast('已复制'); }); };
        let timer; card.ontouchstart = () => { if(!isSorting) timer = setTimeout(() => openEditModal(item.id), 600); };
        card.ontouchend = () => clearTimeout(timer); grid.appendChild(card);
    });
    document.documentElement.style.setProperty('--cols', config.cols);
    document.documentElement.style.setProperty('--t-size', config.tSize + 'px');
    document.documentElement.style.setProperty('--c-size', config.cSize + 'px');
}

function toggleModal(id) {
    const m = document.getElementById(id); m.style.display = (m.style.display === 'block') ? 'none' : 'block';
    if(id === 'settingsModal') {
        document.getElementById('cfgCols').value = config.cols;
        document.getElementById('cfgTSize').value = config.tSize;
        document.getElementById('cfgCSize').value = config.cSize;
        document.getElementById('cfgHaptic').checked = config.haptic;
        document.getElementById('cfgTags').value = config.tags.join(',');
    }
}
function applySettings() {
    config.cols = document.getElementById('cfgCols').value; config.tSize = document.getElementById('cfgTSize').value; config.cSize = document.getElementById('cfgCSize').value; config.haptic = document.getElementById('cfgHaptic').checked;
    config.tags = document.getElementById('cfgTags').value.split(',').map(t=>t.trim()).filter(t=>t!=='');
    localStorage.setItem('pb_config', JSON.stringify(config)); toggleModal('settingsModal'); renderTabs(); renderGrid();
}
function openAddModal() {
    editId = null; document.getElementById('modalTitle').innerText = "新增指令";
    document.getElementById('editTitle').value = ''; document.getElementById('editContent').value = '';
    document.getElementById('editTag').value = (currentTag === '全部' ? '' : currentTag);
    document.getElementById('deleteBtn').style.display = 'none'; toggleModal('editModal'); renderTagPool();
}
function openEditModal(id) {
    editId = id; const item = data.find(d => d.id === id);
    document.getElementById('modalTitle').innerText = "编辑指令";
    document.getElementById('editTitle').value = item.title; document.getElementById('editContent').value = item.content;
    document.getElementById('editTag').value = item.tag; document.getElementById('deleteBtn').style.display = 'block';
    toggleModal('editModal'); renderTagPool();
}
function saveItem() {
    const title = document.getElementById('editTitle').value || '未命名'; const content = document.getElementById('editContent').value || ''; const tag = document.getElementById('editTag').value || '未分类';
    if(editId) { const idx = data.findIndex(d => d.id === editId); data[idx] = {id: editId, title, content, tag}; }
    else { data.push({id: Date.now(), title, content, tag}); }
    localStorage.setItem('pb_data', JSON.stringify(data)); toggleModal('editModal'); renderGrid();
}
function deleteItem() { if(confirm('确定删除？')) { data = data.filter(d => d.id !== editId); localStorage.setItem('pb_data', JSON.stringify(data)); toggleModal('editModal'); renderGrid(); } }

initSortable(document.getElementById('promptGrid'));
renderTabs();
renderGrid();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>指令库-最终修复版</title>
    <style>
        :root { --t-size: 15px; --c-size: 10px; --cols: 3; }
        body { font-family: -apple-system, sans-serif; background: #f2f2f7; margin: 0; padding: 8px; padding-top: 100px; -webkit-user-select: none; }
        .header-fixed { position: fixed; top: 0; left: 0; right: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 0.5px solid #d1d1d6; padding-bottom: 12px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; height: 44px; }
        .nav-bar h1 { font-size: 19px; margin: 0; font-weight: 800; }
        .tabs-container { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 10px; overflow-x: auto; white-space: nowrap; }
        .tab { background: #fff; padding: 5px 12px; border-radius: 12px; font-size: 13px; color: #8e8e93; border: 0.5px solid #d1d1d6; }
        .tab.active { background: #007AFF; color: #fff; border-color: #007AFF; }
        .grid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 6px; padding: 5px 0; }
        .card { background: white; border-radius: 12px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); aspect-ratio: 1 / 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .card-title { font-weight: bold; font-size: var(--t-size); margin-bottom: 6px; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-content { font-size: var(--c-size); color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; line-height: 1.4; pointer-events: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; }
        .modal-content { background: #fff; width: 85%; margin: 15% auto; border-radius: 20px; padding: 20px; max-height: 80vh; overflow-y: auto; }
        .save-btn { background: #007AFF; color: #fff; padding: 12px; border-radius: 10px; border: none; font-weight: bold; width: 100%; }
        #toast { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; display: none; z-index: 3000; }
    </style>
</head>
<body>

<div id="toast"></div>
<div class="header-fixed">
    <div class="nav-bar">
        <span onclick="toggleModal('settingsModal')" style="color:#007AFF; font-size:18px;">⚙️</span>
        <h1>指令库</h1>
        <span onclick="openAddModal()" style="color:#007AFF; font-size:24px">+</span>
    </div>
    <div class="tabs-container" id="tabsList"></div>
</div>
<div class="grid" id="promptGrid"></div>

<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3>数据备份与恢复</h3>
        <button onclick="exportData()" style="background:#f2f2f7; color:#007AFF; width:100%; padding:12px; margin-bottom:10px; border:none; border-radius:10px; font-weight:bold;">1. 点击备份 (复制当前所有数据)</button>
        <button onclick="importData()" style="background:#007AFF; color:#fff; width:100%; padding:12px; border:none; border-radius:10px; font-weight:bold;">2. 点击导入 (粘贴备份代码)</button>
        <hr style="margin:20px 0; border:0.5px solid #eee;">
        <button onclick="resetEverything()" style="color:red; background:none; border:none; width:100%;">⚠️ 重置并清空所有数据</button>
        <button onclick="toggleModal('settingsModal')" style="margin-top:20px; width:100%; border:none; background:#eee; padding:10px; border-radius:10px;">关闭窗口</button>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">编辑</h3>
        <input type="text" id="editTitle" placeholder="标题" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
        <textarea id="editContent" rows="8" placeholder="内容" style="width:100%; padding:10px; box-sizing:border-box;"></textarea>
        <input type="text" id="editTag" placeholder="标签" style="width:100%; padding:10px; margin-top:10px; box-sizing:border-box;">
        <button class="save-btn" style="margin-top:20px;" onclick="saveItem()">保存</button>
        <button onclick="deleteItem()" id="deleteBtn" style="color:red; background:none; border:none; width:100%; margin-top:10px;">删除此项</button>
    </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('pb_data')) || [];
let config = JSON.parse(localStorage.getItem('pb_config')) || { cols: 3, tSize: 15, cSize: 10, haptic: true, tags: ["投资", "阅读"] };
let currentTag = '全部';
let editId = null;

// 【核心修复：最强导入逻辑】
function importData() {
    let str = prompt('请在此粘贴备份代码：');
    if(!str) return;
    try {
        let decoded = str.trim();
        // 尝试自动解开 URI 编码（如果存在 %22 等）
        if(decoded.includes('%')) { decoded = decodeURIComponent(decoded); }
        
        const res = JSON.parse(decoded);
        if(res.data && Array.isArray(res.data)) {
            data = res.data;
            if(res.config) config = res.config;
            // 强制将配置中的字符串转回数字
            config.cols = parseInt(config.cols) || 3;
            config.tSize = parseInt(config.tSize) || 15;
            config.cSize = parseInt(config.cSize) || 10;
            
            localStorage.setItem('pb_data', JSON.stringify(data));
            localStorage.setItem('pb_config', JSON.stringify(config));
            alert('✅ 导入成功！程序将刷新。');
            location.reload();
        } else { throw new Error(); }
    } catch(e) {
        alert('❌ 导入失败：备份代码格式不正确，请确保复制了完整的代码。');
    }
}

// 【核心修复：最纯净导出逻辑】
function exportData() {
    const rawData = { data, config };
    const str = JSON.stringify(rawData);
    // 使用新的 Clipboard API
    const textArea = document.createElement("textarea");
    textArea.value = str;
    document.body.appendChild(textArea);
    textArea.select();
    try {
        document.execCommand('copy');
        showToast('✅ 备份代码已复制到剪贴板');
    } catch (err) {
        alert('请手动复制此内容：' + str);
    }
    document.body.removeChild(textArea);
}

function showToast(text) { const t = document.getElementById('toast'); t.innerText = text; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 2000); }
function renderTabs() {
    const container = document.getElementById('tabsList');
    container.innerHTML = `<div class="tab ${currentTag==='全部'?'active':''}" onclick="filterTag('全部')">全部</div>`;
    config.tags.forEach(tag => { container.innerHTML += `<div class="tab ${currentTag===tag?'active':''}" onclick="filterTag('${tag}')">${tag}</div>`; });
}
function filterTag(tag) { currentTag = tag; renderTabs(); renderGrid(); }
function renderGrid() {
    const grid = document.getElementById('promptGrid'); grid.innerHTML = '';
    const filtered = data.filter(item => currentTag === '全部' || item.tag === currentTag);
    filtered.forEach(item => {
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `<div class="card-title">${item.title}</div><div class="card-content">${item.content}</div>`;
        card.onclick = () => { navigator.clipboard.writeText(item.content).then(() => showToast('已复制内容')); };
        card.oncontextmenu = (e) => { e.preventDefault(); openEditModal(item.id); };
        // 兼容手机长按
        let timer;
        card.ontouchstart = () => timer = setTimeout(() => openEditModal(item.id), 600);
        card.ontouchend = () => clearTimeout(timer);
        grid.appendChild(card);
    });
    document.documentElement.style.setProperty('--cols', config.cols);
}
function toggleModal(id) { const m = document.getElementById(id); m.style.display = (m.style.display === 'block') ? 'none' : 'block'; }
function openAddModal() {
    editId = null; document.getElementById('modalTitle').innerText = "新增";
    document.getElementById('editTitle').value = ''; document.getElementById('editContent').value = '';
    document.getElementById('editTag').value = ''; document.getElementById('deleteBtn').style.display = 'none';
    toggleModal('editModal');
}
function openEditModal(id) {
    editId = id; const item = data.find(d => d.id === id);
    document.getElementById('modalTitle').innerText = "编辑";
    document.getElementById('editTitle').value = item.title; document.getElementById('editContent').value = item.content;
    document.getElementById('editTag').value = item.tag; document.getElementById('deleteBtn').style.display = 'block';
    toggleModal('editModal');
}
function saveItem() {
    const title = document.getElementById('editTitle').value || '未命名';
    const content = document.getElementById('editContent').value || '';
    const tag = document.getElementById('editTag').value || '未分类';
    if(editId) { const idx = data.findIndex(d => d.id === editId); data[idx] = {id: editId, title, content, tag}; }
    else { data.push({id: Date.now(), title, content, tag}); }
    localStorage.setItem('pb_data', JSON.stringify(data));
    toggleModal('editModal'); renderGrid();
}
function deleteItem() { if(confirm('确定删除？')) { data = data.filter(d => d.id !== editId); localStorage.setItem('pb_data', JSON.stringify(data)); toggleModal('editModal'); renderGrid(); } }
function resetEverything() { if(confirm('⚠️ 确定彻底清空？此操作不可逆！')) { localStorage.clear(); location.reload(); } }

renderTabs();
renderGrid();
</script>
</body>
</html>
